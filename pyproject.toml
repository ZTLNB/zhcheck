[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zhcheck"
version = "0.2.0"
description = "零依赖的中文内容规范检查与自动修复工具：中英混排空格、标点全半角、易混词、术语写法"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZTLNB" }]
keywords = [
  "chinese",
  "linter",
  "lint",
  "typography",
  "proofreading",
  "markdown",
  "text",
  "ci",
  "zero-dependency",
  "中文",
  "排版",
  "校对",
  "标点",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# 运行时零依赖。dev 用于本地开发与 CI 的静态检查；toml 为 Python 3.9/3.10
# 补上 pyproject.toml 解析能力（标准库 tomllib 自 3.11 起提供）。
dev = ["ruff>=0.6.0"]
toml = ["tomli>=2.0.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/ZTLNB/zhcheck"
Repository = "https://github.com/ZTLNB/zhcheck"
Issues = "https://github.com/ZTLNB/zhcheck/issues"
Changelog = "https://github.com/ZTLNB/zhcheck/blob/main/CHANGELOG.md"

[project.scripts]
zhcheck = "zhcheck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhcheck = ["data/*.json"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# UP031：项目刻意使用 % 格式化，便于生成对齐的表格文本与中文提示
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
