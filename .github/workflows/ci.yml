name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行单元测试
        run: python -m unittest discover -v

      - name: 以包的形式安装并冒烟测试
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          zhcheck --version
          zhcheck --list-rules

      - name: 检查仓库文档（自举）
        env:
          PYTHONPATH: src
        run: python -m zhcheck . --format github

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装开发依赖
        run: python -m pip install -e ".[dev]"

      - name: 运行 ruff
        run: ruff check src tests

  packaging:
    name: 构建分发包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: 校验包内包含词表数据
        run: |
          python -m pip install dist/*.whl
          python -c "from zhcheck.rules.terms import DEFAULT_CONFUSABLES, DEFAULT_TERMS; assert len(DEFAULT_CONFUSABLES) > 100 and len(DEFAULT_TERMS) > 80"
